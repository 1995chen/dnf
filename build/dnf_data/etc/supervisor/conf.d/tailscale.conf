[program:tailscaled]
command=/bin/bash -c "/home/template/init/tailscale/start_tailscaled.sh"
directory=/home/template/init/tailscale
user=root
autostart=false
autorestart=unexpected
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
redirect_stderr=true
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:tailscale]
command=/bin/bash -c "/home/template/init/tailscale/start_tailscale.sh"
directory=/home/template/init/tailscale
user=root
autostart=false
autorestart=unexpected
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
redirect_stderr=true
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
depend=tailscaled
