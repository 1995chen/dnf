      - OPEN_CHANNEL='12'
      - MAIN_BRIDGE_IP=dnf-cain-core
      - PUBLIC_IP=192.168.31.206
      - CORE_PUBLIC_IP=dnf-diregie-core
      - P2P_PUBLIC_IP=192.168.31.206
      - MAIN_MYSQL_HOST=dnf-mysql
      - MAIN_MYSQL_PORT=3001
      # 大区数据库
      - MYSQL_HOST=dnf-mysql
      - MYSQL_PORT=3001
    shm_size: 8g
    memswap_limit: -1
    mem_limit: 1g
    cpu_count: 1
    restart: always
    ports:
      # 以下端口用户需要访问,必须发布到公网
      - 20012:20012/tcp           # 12频道TCP[狄瑞吉大区]
      - 21012:21012/udp           # 12频道UDP[狄瑞吉大区]
      # 以下端口不需要发布到公网,仅内网访问即可
      - 2022:180/tcp              # supervisor web[管理员用于查看进程状态/用户不需要访问/临时使用后可关闭]
