# GAME服务
  dnf-cain-game:
    hostname: dnf-cain-game
    image: 1995chen/dnf:centos5-d1bef68
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=Asia/Shanghai
      - SERVER_TYPE=GAME
      - SERVER_GROUP=1
      - SERVER_GROUP_DB=cain
      - OPEN_CHANNEL='11'
      - MAIN_BRIDGE_IP=dnf-cain-core
      - PUBLIC_IP=192.168.31.206
      - CORE_PUBLIC_IP=dnf-cain-core
      - P2P_PUBLIC_IP=192.168.31.206
      - MAIN_MYSQL_HOST=dnf-mysql
      - MAIN_MYSQL_PORT=3001
      # 大区数据库
      - MYSQL_HOST=dnf-mysql
      - MYSQL_PORT=3001
    shm_size: 8g
    memswap_limit: -1
    mem_limit: 1g
    cpu_count: 1
    restart: always
    ports:
      # 以下端口用户需要访问,必须发布到公网
      - 10011:10011/tcp           # 11频道TCP[卡恩大区]
      - 11011:11011/udp           # 11频道UDP[卡恩大区]
      # 以下端口不需要发布到公网,仅内网访问即可
      - 2021:180/tcp              # supervisor web[管理员用于查看进程状态/用户不需要访问/临时使用后可关闭]
    volumes:
      - ./data_cain_game:/data
      - ./log_cain_game:/home/neople/game/log
    depends_on:
      - dnf-cain-core
  dnf-diregie-game:
